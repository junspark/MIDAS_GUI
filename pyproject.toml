[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midas-gui"
version = "1.0.0"
description = "PyQt5 desktop GUI for the MIDAS X-ray diffraction suite — data viewing, masking, detector calibration, integration, corrections, PDF and texture analysis."
readme = "README.md"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Dishant Beniwal", email = "107612243+d-beniwal@users.noreply.github.com" }]
requires-python = ">=3.9"
keywords = [
    "MIDAS", "GUI", "PyQt5", "powder diffraction", "calibration",
    "integration", "PDF", "texture", "synchrotron", "crystallography",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Physics",
]

# Core GUI + scientific stack plus the MIDAS analysis backends the GUI drives.
# Pinned to the exact versions of the verified-working environment (see
# environment.yml). The compatibility constraint carries over: numpy is held at
# the 1.26 line because numba 0.59.x needs NumPy < 2.1 and torch 2.4.0 targets
# NumPy 1.x — bumping numpy to 2.x requires moving torch/numba/backends together.
#
# This list is deliberately fully pinned, including packages midas_gui never
# imports directly (numba, scikit-image, and the "transitive MIDAS deps" block
# below): a plain `pip install .` must reproduce the exact verified-working set
# on its own, without relying on environment.yml or on another package's
# install_requires happening to pull the right version.
dependencies = [
    "PyQt5==5.15.10",
    "pyqtgraph==0.14.0",
    "matplotlib==3.8.4",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "h5py==3.11.0",
    "tifffile==2023.4.12",
    "torch==2.4.0",
    "numba==0.59.1",              # NumPy-1.x compatible JIT (newer numba needs NumPy>=2.1);
                                  # required by midas-integrate / midas-zipper, not imported
                                  # directly by midas_gui.
    "scikit-image==0.23.2",       # optional dep of midas-calibrate-v2's auto_seed_calibrant
                                  # (better ring seeding); not declared by that package's own
                                  # metadata (soft/try-except import), so midas_gui must pin
                                  # it explicitly or seeding silently falls back to a coarser
                                  # arc seed.
    # 2026-08-30: bumped as an interdependent set (midas-pdf 0.2.0 requires
    # midas-integrate-v2>=0.7.0, which requires midas-calibrate-v2>=0.11.0 and
    # midas-integrate>=0.7.0) to pick up the midas-integrate-v2 0.7.0 fix for
    # PolygonBinGeometry.from_spec() silently discarding tilt/distortion/
    # parallax/panel-shifts/residual-correction-map (it now routes pixel
    # corners through the shared pixel_to_REta_from_spec, same as every other
    # kernel) and midas-integrate 0.7.0's related QUAD_ORDER area-conservation
    # fix. Verified independently against the diagnosing bug report before
    # upgrading: numeric repro against the pre-upgrade 0.6.0 reproduced the
    # described divergence, and re-run against 0.7.0 gave max|deltaR| = 0.0000
    # px. All requires-dist checked compatible with the numpy 1.26.4 / torch
    # 2.4.0 / numba 0.59.1 pins above.
    "midas-calibrate-v2==0.11.0",
    "midas-integrate-v2==0.7.0",
    "midas-calibrate==0.5.0",
    "midas-hkls==0.9.0",
    "midas-distortion==0.2.0",
    "midas-pdf==0.2.0",           # public PyPI package used by the PDF tab (pdf_backend.py)
    # ── Transitive MIDAS deps pinned explicitly (pulled in by midas-calibrate-v2 /
    #    midas-pdf but not imported by midas_gui directly) ─────────────────────────
    "midas-integrate==0.7.0",
    "midas-peakfit==0.6.0",
    "midas-zipper==0.2.1",
    "midas-params==0.11.1",       # new shared params-file registry/validator dep, first
                                  # required (>=0.9.0) by midas-calibrate/-v2, midas-hkls,
                                  # midas-integrate-v2 and midas-pdf as of this pin bump.
    "zarr==2.18.7",               # required by midas-integrate/-peakfit/-zipper; was already
                                  # pulled in transitively before this pin bump (unpinned), so
                                  # this just makes an existing dependency explicit.
    "numcodecs==0.15.1",          # zarr's codec backend; same "already transitive, now
                                  # explicit" situation as zarr above.
    "hdf5plugin==7.0.0",
    "psutil==7.2.2",
    # pvapy backs the Data Viewer's "Live Data" card (subscribes to an EPICS
    # PVA image PV and renders frames directly in the Data Viewer's own image
    # pane — rings/radial-integration/corrections all work live). Pinned to
    # 5.4.1, NOT latest: 5.5.0+ requires numpy>=2.0, which would upgrade the
    # numpy==1.26.4 pin above and break numba/torch compatibility. 5.4.1
    # declares numpy<2.0,>=1.26, already satisfied by the pin above.
    "pvapy==5.4.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    # Runs the known pyqtgraph-teardown-crash-prone test files (see
    # tests/test_smoke.py, test_hydra_ui.py, test_hydra_calib_ui.py,
    # test_project.py — each carries `pytestmark = pytest.mark.forked`) in a
    # forked subprocess per test, so a segfault/abort there is reported as a
    # normal FAILED with signal info instead of crashing the whole pytest
    # process. Does not fix the underlying pyqtgraph global-registry
    # teardown bug (out of scope, see .context/DECISIONS.md 2026-08-23/
    # 2026-08-26) — only isolates it so it can't take unrelated tests down
    # with it. 1.7.5+ requires pytest>=7 and no longer depends on the old
    # `py` package. Uses os.fork(); Unix/macOS only, no effect on Windows.
    "pytest-forked==1.7.5",
    "build",
    "twine",
]

[project.scripts]
midas-gui = "midas_gui.app:main"

[project.urls]
Homepage = "https://github.com/d-beniwal/MIDAS_GUI"
Issues = "https://github.com/d-beniwal/MIDAS_GUI/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["midas_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# basetemp keeps every tmp_path-based test's scratch output under the repo's
# own .scratch/ (gitignored) instead of scattering pytest-NNNN dirs across
# /tmp indefinitely — `rm -rf .scratch` clears it all in one place.
addopts = "-ra -q --basetemp=.scratch/pytest"
